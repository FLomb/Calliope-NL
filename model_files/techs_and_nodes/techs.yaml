##
# TECHNOLOGY DEFINITIONS
##

templates:
  interest_rate_setter:
    cost_interest_rate:
      data: 0.1  # average wind onshore WACC OECD from [@Steffen:2019]
      index: monetary
      dims: costs

  hv_transmission:
    carrier_in: power
    carrier_out: power
    base_tech: transmission
    flow_out_eff_per_distance: 0.99995 # 5% per 1000km
    lifetime: 60
    template: interest_rate_setter
    cost_flow_cap:
      data: 175  # kEUR per MW
      index: monetary
      dims: costs
  subsea_transmission:
    carrier_in: power
    carrier_out: power
    base_tech: transmission
    flow_out_eff_per_distance: 0.99995 # 5% per 1000km
    lifetime: 60
    template: interest_rate_setter
    cost_flow_cap:
      data: 942  # kEUR per MW
      index: monetary
      dims: costs


techs:

  ##------------------------------------------------------------------------------------------
  # Firm supply
  ##------------------------------------------------------------------------------------------

  # lost load
  lost_load:  # dummy supply technology to represent lost load
    base_tech: supply
    template: interest_rate_setter
    carrier_out: power
    lifetime: 20
    cost_flow_out:
      data: 1e4 # kEUR per MWh, just a very high price, to make it the least attractive option
      index: monetary
      dims: costs
    # lost load-end

  # import power
  import_power:  # dummy supply technology to represent import of power
    base_tech: supply
    template: interest_rate_setter
    carrier_out: power
    lifetime: 20
    cost_flow_out:
      data: 0.1 # kEUR per MWh
      index: monetary
      dims: costs
    # import power-end

  ccgt:
    base_tech: supply
    template: interest_rate_setter
    carrier_out: power
    flow_out_eff: 0.57
    flow_ramping: 0.8
    lifetime: 25
    cost_flow_cap:
      data: 904.7795  # kEUR per MW
      index: monetary
      dims: costs
    cost_flow_out:
      data: 0.00455 # kEUR per MWh
      index: monetary
      dims: costs
    cost_flow_in:
      data: [0.024568, 0.198] # kEUR per MWh (gas price) / tonCO2 per MWh
      index: [monetary,co2]
      dims: costs
    cost_om_annual:
      data: 3.3392 # kEUR per MW peryear
      index: monetary
      dims: costs

  bioenergy:
    base_tech: supply
    template: interest_rate_setter
    carrier_out: power
    flow_out_eff: 0.468
    flow_ramping: 0.8
    lifetime: 30
    flow_cap_max_systemwide: 2200 # about the 10x the currently installed capacity
    cost_flow_cap:
      data: 2337.6116  # kEUR per MW
      index: monetary
      dims: costs
    cost_flow_out:
      data: 0.00455 # kEUR per MWh (assumed same as CCGT)
      index: monetary
      dims: costs
    cost_flow_in:
      data: 0.0074 # kEUR per MWh (bioenergy fuel price)
      index: monetary
      dims: costs
    cost_om_annual:
      data: 4.5269 # kEUR per MW peryear
      index: monetary
      dims: costs


  coal:
    base_tech: supply
    template: interest_rate_setter
    carrier_out: power
    flow_out_eff: 0.356
    flow_ramping: 0.8
    lifetime: 40
    flow_cap_max_systemwide: 0 # Coal phase-out in 2030
    cost_flow_cap:
      data: 3827.1629  # kEUR per MW
      index: monetary
      dims: costs
    cost_flow_out:
      data: 0.00326 # kEUR per MWh
      index: monetary
      dims: costs
    cost_flow_in:
      data: [0.00955, 0.3361] # kEUR per MWh (coal price) / tonCO2 per MWh
      index: [monetary, co2]
      dims: costs
    cost_om_annual:
      data: 1.31 # kEUR per MW peryear
      index: monetary
      dims: costs

  nuclear:
    base_tech: supply
    template: interest_rate_setter
    carrier_out: power
    flow_out_eff: 0.326
    flow_ramping: 0.5
    lifetime: 40
    cost_flow_cap:
      data: 8594.1354  # kEUR per MW
      index: monetary
      dims: costs
    cost_flow_out:
      data: 0.00355 # kEUR per MWh
      index: monetary
      dims: costs
    cost_flow_in:
      data: 0.00341 # kEUR per MWh (nuclear fuel price)
      index: monetary
      dims: costs
    cost_om_annual:
      data: 1.27 # kEUR per MW peryear
      index: monetary
      dims: costs

  ##------------------------------------------------------------------------------------------
  # Variable renewable supply
  ##------------------------------------------------------------------------------------------

  solar_pv:
    base_tech: supply
    template: interest_rate_setter
    carrier_out: power
    source_unit: per_cap
    lifetime: 37.5 
    cost_flow_cap:
      data: 676.5703  # kEUR per MWW
      index: monetary
      dims: costs
    cost_flow_out:
      data:  0.0000106 # kEUR per MWh
      index: monetary
      dims: costs
    cost_om_annual:
      data: 1.7275 # kEUR per MW peryear
      index: monetary
      dims: costs

  wind_onshore:
    base_tech: supply
    template: interest_rate_setter
    carrier_out: power
    source_unit: per_cap
    lifetime: 28.5 
    cost_flow_cap:
      data: 1139.8826 # kEUR per MW
      index: monetary
      dims: costs
    cost_flow_out:
      data: 0.001508 # kEUR per MW
      index: monetary
      dims: costs
    cost_om_annual:
      data: 1.2347 # kEUR per MW peryear
      index: monetary
      dims: costs


  wind_offshore:
    base_tech: supply
    template: interest_rate_setter
    carrier_out: power
    source_unit: per_cap
    lifetime: 30 
    cost_flow_cap:
      data: 1769.1171 # kEUR per MW
      index: monetary
      dims: costs
    cost_flow_out:
      data: 0.0000212 # kEUR per MW
      index: monetary
      dims: costs
    cost_om_annual:
      data: 2.374 # kEUR per MW peryear
      index: monetary
      dims: costs


  ##------------------------------------------------------------------------------------------
  # Storage
  ##------------------------------------------------------------------------------------------

  # battery storage
  battery:        
    base_tech: storage
    template: interest_rate_setter
    carrier_in: power
    carrier_out: power    
    cyclic_storage: false   
    initial_storage: 0
    storage_discharge_depth: 0.01
    lifetime: 15  # 8000 charge cycles
    flow_cap_per_storage_cap_max: 0.25 #takes four hours for discharging 
    flow_out_eff: 0.95
    flow_in_eff: 0.95
    storage_loss: 0.01  # 1% loss per hour assumedcosts:
    cost_storage_cap: 
      data: 885 # kEUR per MWh
      index: monetary
      dims: costs
    cost_om_annual: 
      data: 0.57 # kEUR per MW per year
      index: monetary
      dims: costs
    cost_flow_out: 
      data: 0.0020 # kEUR/MWh
      index: monetary
      dims: costs
  # battery storage-end

  # power-to-hydrogen-to-power storage
  hydrogen_power_storage:         
    base_tech: storage
    template: interest_rate_setter
    carrier_in: power
    carrier_out: power 
    cyclic_storage: false   
    initial_storage: 0
    lifetime: 17.5  # average of 10 years (fuel cell) and 25 (electrolyser)
    flow_out_eff: 0.5 # fuel cell
    flow_in_eff: 0.5874 # electrolyser
    cost_storage_cap: 
      data: 54.5 # kEUR per MWh
      index: monetary
      dims: costs
    cost_flow_cap: 
      data: 4403.83 # kEUR per MW_el | from Schmidt 2019, 3575.22 $/kW * 1.34 (2015 to 2025 inflation) * 0.92 (dollar to EUR 2025) 
      index: monetary
      dims: costs
    cost_om_annual: 
      data: 4.5 # kEUR per MW per year (average of fuel cell and electrolyser, DEA 2025)
      index: monetary
      dims: costs
    cost_flow_out: 
      data: 0 # kEUR/MWh
      index: monetary
      dims: costs       
  # power-to-hydrogen-to-power storage-end


  ##------------------------------------------------------------------------------------------
  # Demand
  ##------------------------------------------------------------------------------------------

  demand_power:
    base_tech: demand
    carrier_in: power

  curtailment:
    base_tech: demand
    carrier_in: power
    source_use_max: 20000 # higher than peak demand

  export_power:
    base_tech: demand
    carrier_in: power
    source_use_max: 20000 # higher than peak demand
    cost_flow_in:
      data: -0.1 # kEUR per MW
      index: monetary
      dims: costs
